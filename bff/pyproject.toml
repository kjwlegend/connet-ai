[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "connet-ai-bff"
version = "0.1.0"
description = "Backend for Frontend service for Connet.AI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
authors = [
    {name = "Connet.AI Team", email = "dev@connet.ai"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # FastAPI Core
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "gunicorn>=22.0.0",
    # Database & ORM
    "sqlmodel>=0.0.18",
    "asyncpg>=0.30.0",
    "alembic>=1.13.2",
    # Supabase Integration
    "supabase>=2.0.3",
    "postgrest>=0.13.1",
    # Redis & Caching
    "redis[hiredis]>=5.0.1",
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # AI & LangChain
    "langchain>=0.2.11",
    "langchain-openai>=0.1.19",
    "langchain-community>=0.2.11",
    "langgraph>=0.1.19",
    "openai>=1.35.0",
    # Vector Database
    "pgvector>=0.2.4",
    "aiohttp>=3.9.5",
    # Data Processing
    "pydantic[email]>=2.8.2",
    "pydantic-settings>=2.4.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "structlog>=23.2.0",
    "rich>=13.7.1",
    # Task Queue
    "arq>=0.25.0",
    # Monitoring
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "httpx>=0.26",
    "pypinyin>=0.55.0",
    "psycopg2-binary>=2.9.10",
    "supabase-auth>=2.20.0"
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-mock>=3.12.0",
    "httpx>=0.24.1",
    
    # Code Quality
    "black>=24.4.2",
    "isort>=5.13.2",
    "flake8>=7.1.0",
    "mypy>=1.10.0",
    
    # Development Tools
    "pre-commit>=3.7.0",
    "watchdog>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/connet-ai/xiaoguang-next-gen"
Documentation = "https://docs.connet.ai"
Repository = "https://github.com/connet-ai/xiaoguang-next-gen.git"
Issues = "https://github.com/connet-ai/xiaoguang-next-gen/issues"

[project.scripts]
bff-dev = "app.main:run_dev"
bff-prod = "app.main:run_prod"

[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.hatch.version]
path = "app/__init__.py"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "supabase.*",
    "postgrest.*",
    "langchain.*",
    "openai.*",
    "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]
asyncio_mode = "auto"
