# Redis 配置文件 - 用于开发环境

# 基础设置
port 6379
bind 0.0.0.0
protected-mode no

# 内存设置
maxmemory 128mb
maxmemory-policy allkeys-lru

# 持久化设置
save 900 1
save 300 10
save 60 10000

# AOF 持久化
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 网络设置
tcp-keepalive 300
timeout 0

# 日志设置
loglevel notice
logfile ""

# 数据库设置
databases 16

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 客户端连接
maxclients 10000

# 安全设置 (开发环境)
# requirepass yourpassword  # 开发环境暂时禁用密码

# 其他设置
tcp-backlog 511
hz 10 