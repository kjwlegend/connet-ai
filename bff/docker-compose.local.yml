# Docker Compose for Local Development - Enhanced Version
# 使用命令: docker-compose -f docker-compose.local.yml up -d

version: '3.8'

services:
  # FastAPI BFF Service
  bff:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connet-bff
    ports:
      - '8000:8000'
    environment:
      # 应用配置
      - APP_NAME=Connet.AI BFF
      - APP_VERSION=1.0.0
      - ENVIRONMENT=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000

      # 数据库配置 - 从环境变量读取
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-connet_ai}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-connet_ai}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}

      # Redis 配置
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0

      # JWT & 安全配置
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-super-secret-jwt-key-change-in-production}
      - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY:-dev-super-secret-refresh-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY:-dev-32-byte-encryption-key-change}

      # CORS 配置
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000}
      - CORS_ALLOW_CREDENTIALS=true
      - CORS_ALLOW_METHODS=GET,POST,PUT,DELETE,OPTIONS,PATCH
      - CORS_ALLOW_HEADERS=*

      # 日志和性能
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKERS=1
      - MAX_CONNECTIONS=100

      # 开发工具
      - ENABLE_DOCS=true
      - ENABLE_REDOC=true
      - ENABLE_OPENAPI=true

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - connet_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: connet-postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-connet_ai}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./alembic/versions:/docker-entrypoint-initdb.d/migrations:ro
    restart: unless-stopped
    networks:
      - connet_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-connet_ai}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres 
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  # Redis
  redis:
    image: redis:7-alpine
    container_name: connet-redis
    ports:
      - '6379:6379'
    volumes:
      - ./data/redis:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    networks:
      - connet_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: redis-server /usr/local/etc/redis/redis.conf --appendonly yes

  # MailHog (邮件测试工具)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: connet-mailhog
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI
    restart: unless-stopped
    networks:
      - connet_network
    profiles:
      - tools

networks:
  connet_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
